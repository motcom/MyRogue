[package]
name = "my_rogue"
version = "0.1.0"
edition = "2024"

[dependencies]
bracket-lib = { git = "https://github.com/amethyst/bracket-lib", branch = "master" }
mlua = { version = "0.12.2", features = ["lua54", "vendored", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.24.9", default-features = false, features = ["png"] }
rodio = { version = "0.21.1", default-features = false, features = ["playback", "wav"] }
