[package]
name = "map_gen"
version = "0.1.0"
edition = "2024"

[dependencies]
bracket-noise = { git = "https://github.com/amethyst/bracket-lib", rev = "ce9124ad744553b2576e44df44e94b0f72faa8e8" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.24.9", default-features = false, features = ["png"] }
